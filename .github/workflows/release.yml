name: Release

# Pushing a tag like v0.1.0 builds the binary and attaches it to a GitHub
# release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --locked --release --package mousekit
      - name: Package
        run: |
          name="mousekit-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/release/mousekit README.md LICENSE "$name/"
          cp -r packaging docs/examples "$name/"
          tar -czf "$name.tar.gz" "$name"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mousekit-*.tar.gz --generate-notes
