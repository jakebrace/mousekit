[package]
name = "mousekit-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "mousekit_daemon"

[dependencies]
mousekit-core = { path = "../core" }
mousekit-input = { path = "../input" }
mousekit-focus = { path = "../focus" }
mousekit-hw = { path = "../hw" }
toml = "1.2.1"
# Same zbus major version as ksni uses, so the binary carries one copy.
zbus = "5.19.0"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
