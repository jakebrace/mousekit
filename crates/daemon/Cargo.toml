[package]
name = "mouse-profiles-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "mouse_profiles_daemon"

[dependencies]
mouse-profiles-core = { path = "../core" }
mouse-profiles-input = { path = "../input" }
mouse-profiles-focus = { path = "../focus" }
mouse-profiles-hw = { path = "../hw" }
toml = "1.2.1"
# Same zbus major version as ksni uses, so the binary carries one copy.
zbus = "5.19.0"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
