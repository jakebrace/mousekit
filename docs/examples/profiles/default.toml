# ~/.config/mouse-profiles/profiles/default.toml
# The profile used when no app-specific profile matches. App profiles are
# layered over it: anything bound here applies everywhere unless an app
# profile says otherwise.
# Controls not listed behave as normal. Left click cannot be bound.

name = "Default"

[bindings]
# Nothing bound by default: the mouse behaves normally outside your games.
# Binding types, for reference:
# M5 = { type = "key", keys = ["KEY_LEFTALT", "KEY_TAB"] }   # a chord
# M5 = { type = "mouse_button", button = "BTN_MIDDLE" }
# M5 = { type = "disabled" }
